<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Analizador de Páginas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <main class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Sitios web analizados</h1>
        <a href="/" class="btn btn-primary">Analizar otra página</a>
      </div>
      
      <table class="table table-bordered table-hover" data-test="urls">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Última revisión</th>
            <th>Fecha de creación</th>
          </tr>
        </thead>
        <tbody>
          {% for url in urls %}
          <tr>
            <td>{{ url.id }}</td>
            <td><a href="/urls/{{ url.id }}">{{ url.name }}</a></td>
            <td>{{ url.last_check.date() if url.last_check else '' }}</td>
            <td>{{ url.created_at.date() }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
  </body>
</html>

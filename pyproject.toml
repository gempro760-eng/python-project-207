[project]
name = "hexlet-code"
version = "0.1.0"
description = "Analizador de páginas"
readme = "README.md"
authors = [
    { name = "Natchlazen", email = "gempro760@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "blinker>=1.9.0",
    "click>=8.4.2",
    "flask>=3.1.3",
    "gunicorn>=26.1.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "validators>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.4",
]

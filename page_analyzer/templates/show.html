<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Analizador de Páginas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <!-- Encabezado de mensajes Flash -->
    <header>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show rounded-0 mb-0" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </header>

    <main class="container mt-5">
      <h1>Sitio web: {{ url.name }}</h1>
      <!-- Atributo data-test="url" requerido por las pruebas -->
      <table class="table table-bordered table-hover mt-3" data-test="url">
        <tbody>
          <tr>
            <td>ID</td>
            <td>{{ url.id }}</td>
          </tr>
          <tr>
            <td>Nombre</td>
            <td>{{ url.name }}</td>
          </tr>
          <tr>
            <td>Fecha de creación</td>
            <td>{{ url.created_at.date() }}</td>
          </tr>
        </tbody>
      </table>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

[project]
name = "hexlet-code"
version = "0.1.0"
description = "Analizador de páginas"
readme = "README.md"
authors = [
    { name = "Natchlazen", email = "gempro760@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.1.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
